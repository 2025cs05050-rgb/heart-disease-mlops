[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "notebooks",
    "mlruns",
    "data",
    "models",
    "reports",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # handled by formatter / long URLs in comments
    "B008",   # FastAPI Depends(...) idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
